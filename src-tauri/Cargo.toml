[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# SQLite — bundled feature 内嵌 SQLite,免外部 DLL,满足"完全离线"安全要求。
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "2"
# ring: AEAD 加密 + 机器绑定密钥(cookie 加密存储)
ring = { version = "0.17", features = [] }
# reqwest: HTTP 客户端,用于 opencode.ai API(配额查询)。
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
